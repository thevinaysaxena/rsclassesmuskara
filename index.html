#sn span{opacity:0;transform:translateY(16px);animation:up .45s forwards}

.by{opacity:0;animation:fade .6s 2s forwards}.tg{color:var(--orange);font-weight:700}

#auth{padding:28px 24px 40px;text-align:center}#auth .logo{margin:10px auto 12px}#auth h1{color:var(--blue)}

nav button::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--orange);position:absolute;bottom:6px;opacity:0;transform:scale(0);transition:.25s}nav button.on::after{opacity:1;transform:scale(1)}
nav button.mid{flex:none;width:68px;height:68px;margin-top:-14px;border-radius:50%;background:var(--card);box-shadow:0 -2px 10px rgba(249,115,22,.35);border:2px solid rgba(249,115,22,.4)}nav button.mid svg{width:32px;height:32px}
#ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;animation:sl .25s ease-out;padding-top:env(safe-area-inset-top,0px)}
.ovh{position:sticky;top:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;z-index:2}.ovh button{background:none;color:#fff;font-size:24px}
.ovb{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}

.menu button{display:flex;width:100%;gap:14px;align-items:center;background:var(--card);padding:15px;margin-top:8px;border-radius:12px;font-size:16px;text-align:left}.menu b{margin-left:auto;color:var(--light)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:492px;margin:0 auto;background:var(--blue);color:#fff;padding:12px;border-radius:12px;text-align:center;z-index:60;font-size:14px}
@media print{body>*:not(#ov){display:none!important}.ovh,.noprint{display:none!important}#ov{position:static}}
textarea{width:100%;background:var(--field);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qt{background:var(--card);border-radius:14px;padding:14px 6px;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}.qt i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.stat2{background:var(--card);border-radius:12px;padding:12px;text-align:center}.stat2 b{display:block;font-size:22px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:16px}.opt.on{border-color:var(--orange);background:rgba(249,115,22,.12)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.ps{width:100%;font-size:12px;color:var(--light);margin-top:8px}
.pb{width:38px;height:38px;border-radius:8px;background:var(--line);font-weight:700}.pb.an{background:#16A34A;color:#fff}.pb.mk{background:#7C3AED;color:#fff}.pb.cur{outline:3px solid var(--orange)}
</style>

<script>

  k.flat(Infinity).filter(c=>c!=null&&c!==false).forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e};

hi:{gm:'सुप्रभात',ga:'नमस्कार',ge:'शुभ संध्या',search:'कोर्स, टीचर खोजें...',feat:'खास कोर्स',pop:'लोकप्रिय कोर्स',newc:'नए कोर्स',cat:'कैटेगरी देखें',tch:'हमारे टीचर',demo:'फ्री डेमो क्लास',not:'ताज़ा सूचनाएँ',lib:'लाइब्रेरी',my:'मेरे कोर्स',dl:'डाउनलोड',edit:'प्रोफाइल बदलें',pur:'खरीद इतिहास और इनवॉइस',cert:'सर्टिफिकेट',prog:'उपस्थिति और प्रगति',res:'टेस्ट रिज़ल्ट',notif:'नोटिफिकेशन',lang:'भाषा',help:'मदद और सपोर्ट',about:'ऐप के बारे में',share:'ऐप शेयर करें',terms:'नियम और गोपनीयता',out:'लॉगआउट',enr:'अभी जुड़ें',free:'फ्री',empty:'कोई कोर्स नहीं मिला।',emy:'आपने अभी कोई कोर्स नहीं लिया। लाइब्रेरी में देखें।',edl:'आपके कोर्स के नोट्स यहाँ दिखेंगे।',save:'सेव करें'}};
let lang=ls.get('rs_lang','en');const t=k=>(S[lang]&&S[lang][k])||S.en[k]||k;

let CATS=['Class 9-12','JEE','NEET','SSC','Banking'],CC={'Class 9-12':'#1E3A8A',JEE:'#B45309',NEET:'#15803D',SSC:'#7C3AED',Banking:'#0F766E'};
let D={courses:[],banners:[],teachers:[],demos:[],notices:[]},E={},U=null,tab='home',q='',lcat='All',hcat=CATS[0],pg=null,bt=null,cf=null,vf=null;
const byTag=x=>D.courses.filter(c=>(c.tg||'').includes(x));
const price=c=>c.p>0?'₹'+c.p:t('free');
const grad=c=>'background:linear-gradient(135deg,'+(CC[c.cat]||PALX[Math.max(0,CATS.indexOf(c.cat))%5])+',#F97316)';
const isAct=c=>E[c.id]&&E[c.id].status==='active'&&(!E[c.id].expMs||E[c.id].expMs>Date.now());
const pct=c=>isAct(c)&&c.n?Math.round(E[c.id].done*100/c.n):0;

/* ---- splash + silent session check ---- */
'RS Classes Muskara'.split('').forEach((ch,i)=>$('sn').append(h('span',{style:'animation-delay:'+(0.9+i*0.07)+'s'},ch===' '?'\u00a0':ch)));
const authReady=new Promise(r=>{const un=auth.onAuthStateChanged(u=>{un();r(u)})});
Promise.all([new Promise(r=>setTimeout(r,3000)),authReady]).then(([,u])=>{$('splash').hidden=true;route(u)});

async function route(u){
  if(!u)return authView();
  try{const s=await db.collection('users').doc(u.uid).get();
    if(s.exists){U={uid:u.uid,...s.data()};await enter()}
    else{as.step='signup';as.phone=(u.phoneNumber||'').replace('+91','');authView()}
  }catch(e){toast(ERR(e));as.step='phone';authView()}
}
async function enter(){
  const g=n=>db.collection(n).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
  [D.courses,D.banners,D.teachers,D.demos,D.notices,D.categories]=await Promise.all(['courses','banners','teachers','demos','notices','categories'].map(g));

  const es=await db.collection('enrollments').where('uid','==',U.uid).get();E={};es.forEach(d=>E[d.data().cid]=d.data());await loadExtras();
  $('auth').classList.add('hidden');$('main').classList.remove('hidden');$('nav').classList.remove('hidden');buildNav();tab='home';render();
}

/* ---- login / sign up ---- */
let as={step:'phone',phone:'',err:'',name:'',cls:'Class 10',city:'',photo:''};
const CLS=['Class 9','Class 10','Class 11','Class 12','JEE','NEET','SSC','Banking','Other'];

    const b=h('button',{class:'btn'},'Send OTP');
    b.onclick=async()=>{if(!/^[6-9]\d{9}$/.test(as.phone)){as.err='Enter a valid 10-digit mobile number';return authView()}
      b.disabled=true;b.textContent='Sending...';
      try{if(vf){try{vf.clear()}catch(e){}}vf=new firebase.auth.RecaptchaVerifier('rc',{size:'invisible'});cf=await auth.signInWithPhoneNumber('+91'+as.phone,vf);as.step='otp';as.err=''}catch(e){as.err=ERR(e)}authView()};

      try{const r=await cf.confirm(i.value);as.err='';await route(r.user)}catch(e){as.err=ERR(e);authView()}};
    k.push(h('h2',{},'Verify OTP'),h('p',{class:'sub'},'OTP sent to +91 '+as.phone),i,errBox(),b,

    box.replaceChildren(
      h('div',{class:'ovh'},h('b',{style:'flex:1'},tt.t),h('span',{},'⏱'),timerEl,h('button',{style:'font-size:15px;border:1px solid #fff8;border-radius:8px;padding:4px 10px',onclick:()=>{const un=qs.filter(x=>st.a[x.id]==null).length;if(confirm('Submit the test? Unanswered: '+un))submit()}},'Submit')),
      h('div',{class:'ovb'},h('small',{style:'color:var(--light)'},'Question '+(cur+1)+' of '+qs.length+(q.s?' · '+q.s:'')),
        h('p',{style:'font-size:18px;margin:8px 0 12px;line-height:1.5'},q.q),
        q.o.map((o,i)=>h('button',{class:'opt'+(ans===i?' on':''),onclick:()=>{st.a[q.id]=i;save();draw()}},h('b',{},'ABCD'[i]+'. '),o)),
        h('div',{style:'display:flex;gap:8px;margin-top:12px'},h('button',{class:'btn g',style:'margin:0',onclick:()=>{cur=Math.max(0,cur-1);draw()}},'← Prev'),h('button',{class:'btn',style:'margin:0',onclick:()=>{cur=Math.min(qs.length-1,cur+1);draw()}},'Next →')),
        h('div',{style:'display:flex;gap:8px;margin-top:8px'},h('button',{class:'btn g',style:'margin:0;min-height:44px;font-size:15px',onclick:()=>{st.m[q.id]=!st.m[q.id];save();draw()}},st.m[q.id]?'Unmark review':'🔖 Mark for review'),h('button',{class:'btn g',style:'margin:0;min-height:44px;font-size:15px',onclick:()=>{delete st.a[q.id];save();draw()}},'Clear answer')),
        h('div',{class:'pal'},qs.map((x,i)=>[i===0||x.s!==qs[i-1].s?h('div',{class:'ps'},x.s||''):null,h('button',{class:'pb'+(i===cur?' cur':'')+(st.m[x.id]?' mk':st.a[x.id]!=null?' an':''),onclick:()=>{cur=i;draw()}},i+1)]))))}
  draw();
}
async function finishTest(tt,answers,box){
  box.replaceChildren(h('div',{class:'ovb'},h('div',{class:'empty'},'Submitting...')));
  try{await db.collection('attempts').doc(U.uid+'_'+tt.id).set({uid:U.uid,tid:tt.id,name:U.name,answers,ts:TS()})}catch(e){toast(ERR(e));box.remove();return}
  const close=()=>{box.remove();render()};
  try{const n=await resultNode(tt);box.replaceChildren(h('div',{class:'ovh'},h('button',{onclick:close},'←'),h('b',{},'Result')),h('div',{class:'ovb'},n))}
  catch(e){box.replaceChildren(h('div',{class:'ovb'},h('div',{class:'err'},ERR(e)),h('button',{class:'btn',onclick:close},'Close')))}
}
function resultBox(tt){const b=h('div',{},h('div',{class:'empty'},'Loading result...'));resultNode(tt).then(n=>b.replaceChildren(n)).catch(e=>b.replaceChildren(h('div',{class:'err'},ERR(e))));return b}
async function resultNode(tt){
  const id=U.uid+'_'+tt.id,tr=db.collection('tests').doc(tt.id);
  const [qsS,kS,aS,allS]=await Promise.all([tr.collection('questions').get(),tr.collection('keys').get(),db.collection('attempts').doc(id).get(),db.collection('attempts').where('tid','==',tt.id).get()]);
  const qs=qsS.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.order-b.order),K={};kS.forEach(d=>K[d.id]=d.data());
  const at=aS.data(),ans=at.answers||{};let c=0,w=0,sk=0;const sub={};
  qs.forEach(q=>{const s=q.s||'General';sub[s]=sub[s]||{c:0,w:0,s:0};const a=ans[q.id];if(a==null||!K[q.id]){sk++;sub[s].s++}else if(a===K[q.id].a){c++;sub[s].c++}else{w++;sub[s].w++}});
  const score=Math.round((c*tt.pos-w*tt.neg)*100)/100;
  if(at.score==null){try{await db.collection('attempts').doc(id).update({score,correct:c,wrong:w,skipped:sk,subj:sub})}catch(e){}}
  A[tt.id]={...at,score,correct:c,wrong:w,skipped:sk};
  const scores=allS.docs.filter(d=>d.id!==id).map(d=>d.data().score).filter(x=>x!=null);scores.push(score);
  const rank=1+scores.filter(x=>x>score).length,n=scores.length,pc=Math.round(scores.filter(x=>x<score).length/n*1000)/10;
  const mk=(l,v,col)=>h('div',{class:'stat2'},h('b',{style:'color:'+col},v),h('small',{style:'color:var(--light)'},l));
  return h('div',{},h('div',{class:'prof',style:'display:block;text-align:center'},h('div',{style:'font-size:34px;font-weight:800;color:var(--orange)'},score+' / '+(tt.n*tt.pos)),h('small',{style:'color:var(--light)'},'Rank '+rank+' of '+n+' · Percentile '+pc)),
    h('div',{class:'g3'},mk('Correct',c,'#16A34A'),mk('Wrong',w,'var(--err)'),mk('Skipped',sk,'var(--light)')),
    h('h3',{},'Subject-wise performance'),Object.entries(sub).map(([s,v])=>{const tot=v.c+v.w+v.s,acc=tot?Math.round(v.c*100/tot):0;return h('div',{class:'row',style:'display:block'},h('b',{},s),h('small',{},v.c+'/'+tot+' correct · accuracy '+acc+'%'),h('div',{class:'bar'},h('i',{style:'width:'+acc+'%'})))}),
    h('h3',{},'Answers & explanations'),qs.map((q,i)=>{const a=ans[q.id],ka=K[q.id]?K[q.id].a:-1;
      return h('div',{class:'row',style:'display:block;border-left:4px solid '+(a==null?'var(--line)':a===ka?'#16A34A':'var(--err)')},h('b',{},(i+1)+'. '+q.q),
        q.o.map((o,j)=>h('div',{style:'margin-top:4px;'+(j===ka?'color:#16A34A;font-weight:700':j===a?'color:var(--err)':'')},'ABCD'[j]+'. '+o+(j===ka?' ✓':j===a?' ✗ (your answer)':''))),
        K[q.id]&&K[q.id].ex?h('small',{style:'margin-top:6px'},'💡 '+K[q.id].ex):null)}));
}
function pResults(){const l=Object.values(A).filter(a=>a.score!=null).map(a=>({a,tt:D.tests.find(x=>x.id===a.tid)})).filter(x=>x.tt);
  return l.length?l.map(({a,tt})=>h('div',{class:'row',style:'cursor:pointer',onclick:()=>openPage(tt.t,()=>resultBox(tt))},h('div',{class:'t'},h('b',{},tt.t),h('small',{},a.correct+' correct · '+a.wrong+' wrong · '+a.skipped+' skipped')),h('b',{style:'color:var(--orange)'},a.score+' / '+tt.n*tt.pos))):h('div',{class:'empty'},'You have not attempted any test yet. Open Test Series from Home.')}

/* ---- doubts ---- */
function pDoubts(){
  const box=h('div'),list=h('div');let all=[],sub='All';
  const paint=()=>{const l=all.filter(d=>sub==='All'||d.subject===sub);
    list.replaceChildren(...(l.length?l.map(d=>h('div',{class:'row',style:'cursor:pointer',onclick:()=>openPage('Doubt',()=>doubtView(d.id))},h('div',{class:'t'},h('b',{},d.q.slice(0,70)),h('small',{},d.subject+' · '+(d.status==='resolved'?'✅ Resolved':d.sr?'💬 Answered':'⏳ Waiting'))))):[h('div',{class:'empty'},'No doubts here.')]))};
  box.append(h('button',{class:'btn',style:'margin-top:0',onclick:()=>openPage('Ask a doubt',pAsk)},'+ Ask a doubt'),
    h('div',{class:'chips',style:'margin-top:12px'},['All',...SUBJL].map(s=>h('button',{class:'chip'+(s==='All'?' on':''),onclick:e=>{sub=s;[...e.target.parentNode.children].forEach(x=>x.classList.toggle('on',x===e.target));paint()}},s))),list);
  db.collection('doubts').where('uid','==',U.uid).get().then(s=>{all=s.docs.map(d=>({id:d.id,...d.data()})).sort(srt);paint()}).catch(e=>list.append(h('div',{class:'err'},ERR(e))));
  return box;
}
function pAsk(){
  const d={subject:SUBJL[0],q:'',img:''};
  return [h('div',{class:'f'},h('label',{},'Subject'),h('select',{onchange:e=>d.subject=e.target.value},SUBJL.map(s=>h('option',{},s)))),
    h('div',{class:'f'},h('label',{},'Your question *'),h('textarea',{rows:'5',oninput:e=>d.q=e.target.value})),
    h('div',{class:'f'},h('label',{},'Add a photo (optional)'),h('input',{type:'file',accept:'image/*',onchange:e=>{const x=e.target.files[0];if(x)resizeTo(x,640,r=>{d.img=r;toast('Photo added')})}})),
    h('button',{class:'btn',onclick:async e=>{if(d.q.trim().length<5)return toast('Write your question (at least 5 letters)');e.target.disabled=true;
      try{await db.collection('doubts').add({uid:U.uid,name:U.name,subject:d.subject,q:d.q.trim(),img:d.img,status:'open',ts:TS(),sr:0});toast('Doubt sent to teachers');openPage('Doubts',pDoubts)}catch(x){toast(ERR(x));e.target.disabled=false}}},'Send doubt')];
}
function doubtView(id){
  const box=h('div'),dr=db.collection('doubts').doc(id);
  Promise.all([dr.get(),dr.collection('replies').get()]).then(([ds,rs])=>{const d=ds.data(),reps=rs.docs.map(x=>x.data()).sort((a,b)=>-srt(a,b));const ta=h('textarea',{rows:'3',placeholder:'Write a reply...'});
    box.replaceChildren(h('div',{class:'row',style:'display:block'},h('small',{},d.subject+' · '+d.status),h('p',{style:'margin:6px 0;white-space:pre-wrap'},d.q),d.img?h('img',{src:d.img,style:'max-width:100%;border-radius:8px'}):null),
      reps.map(r=>h('div',{class:'row'},h('div',{class:'t'},h('b',{},r.staff?'👨‍🏫 Teacher':'You'),h('small',{style:'white-space:pre-wrap;color:var(--text)'},r.text)))),
      h('div',{class:'f'},ta),
      h('button',{class:'btn',onclick:async()=>{const x=ta.value.trim();if(x.length<2)return toast('Write something first');try{await dr.collection('replies').add({uid:U.uid,name:U.name,staff:false,text:x,ts:TS()});openPage('Doubt',()=>doubtView(id))}catch(e){toast(ERR(e))}}},'Send'),
      d.status==='open'?h('button',{class:'btn g',onclick:async()=>{try{await dr.update({status:'resolved'});openPage('Doubt',()=>doubtView(id))}catch(e){toast(ERR(e))}}},'Mark as resolved'):null)}).catch(e=>box.replaceChildren(h('div',{class:'err'},ERR(e))));
  return box;
}
