<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RS Classes Muskara</title>
<style>
:root{--blue:#1E3A8A;--orange:#F97316;--bg:#F8FAFC;--card:#fff;--text:#0F172A;--light:#64748B;--line:#E2E8F0;--errbg:#FEE2E2;--err:#DC2626;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#131C2E;--text:#E5E7EB;--light:#94A3B8;--line:#26324A;--errbg:#3B1414;--err:#FCA5A5;--field:#0F172A}}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;color:inherit}
[hidden],.hidden{display:none!important}
.w{max-width:520px;margin:0 auto}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:24px;background:linear-gradient(160deg,#1E3A8A 0%,#1E3A8A 55%,#F97316 150%);background-size:200% 200%;animation:bg 3s ease-in-out}
@keyframes bg{to{background-position:100% 100%}}
.logo{width:96px;height:96px;border-radius:50%;background:var(--blue);border:5px solid var(--orange);color:#fff;font-weight:900;font-size:38px;display:flex;align-items:center;justify-content:center}
#splash .logo{width:130px;height:130px;font-size:52px;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both,glow 1.6s .9s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(249,115,22,.4)}50%{box-shadow:0 0 54px rgba(249,115,22,.95)}}
#sn{font-size:28px;font-weight:800;margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center}
#sn span{opacity:0;transform:translateY(16px);animation:up .45s forwards}
@keyframes up{to{opacity:1;transform:none}}
.by{opacity:0;animation:fade .6s 2s forwards}.tg{color:var(--orange);font-weight:700}
#splash .tg{opacity:0;animation:fade .7s 2.2s forwards;font-size:17px}
@keyframes fade{to{opacity:1}}
#auth{padding:28px 24px 40px;text-align:center}#auth .logo{margin:10px auto 12px}#auth h1{color:var(--blue)}
@media (prefers-color-scheme:dark){#auth h1{color:#93C5FD}}
#auth h2{margin:22px 0 6px}.sub{color:var(--light);margin-bottom:14px;font-size:15px}
.f{text-align:left;margin-top:12px}.f label{display:block;font-size:13px;color:var(--light);margin-bottom:5px}
input,select{width:100%;background:var(--field);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:17px;outline:none}
input:focus,select:focus{border-color:var(--orange)}
.btn{width:100%;min-height:54px;border-radius:14px;background:var(--orange);color:#fff;font-size:18px;font-weight:700;margin-top:16px}
.btn.g{background:none;color:var(--orange);border:1.5px solid var(--orange)}.btn:disabled{opacity:.6}
.err{background:var(--errbg);color:var(--err);padding:11px;border-radius:10px;margin-top:12px;font-size:14px;text-align:left}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex:none;border:3px solid var(--orange)}
#main{padding-bottom:92px}.fx{animation:sl .28s ease-out}@keyframes sl{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pad{padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top small{color:var(--light);display:block}.top b{font-size:20px}
.bell{position:relative;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.srch{margin-top:12px}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-top:14px;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}
.bn{flex:none;width:100%;scroll-snap-align:center;border-radius:18px;color:#fff;padding:22px 18px;min-height:120px}.bn b{font-size:20px;display:block}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--orange);width:18px}
h3{font-size:18px;margin:22px 0 10px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.cc{flex:none;width:158px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.1);cursor:pointer}
.g2 .cc{width:auto}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th{height:86px;display:flex;align-items:center;justify-content:center;font-size:38px}
.cb{padding:9px}.cb b{display:block;font-size:13.5px;line-height:1.3;min-height:35px}.cb small{display:block;color:var(--light);font-size:12px;margin-top:2px}
.pr{color:var(--orange);font-weight:800;margin-top:5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;white-space:nowrap;font-weight:600}.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tc{flex:none;width:92px;text-align:center}.tc .av{width:68px;height:68px;margin:0 auto 6px;font-size:30px}.tc b{font-size:13px;display:block}.tc small{color:var(--light);font-size:12px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:12px;margin-top:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row .t{flex:1;min-width:0}.row small{color:var(--light);display:block}.row a,.row button.s{color:var(--orange);font-weight:700;background:none;text-decoration:none}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--orange)}
.empty{text-align:center;color:var(--light);padding:44px 12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto;align-items:center}
nav button{flex:1;background:none;color:var(--light);height:60px;display:flex;align-items:center;justify-content:center;position:relative}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav button.on{color:var(--orange)}nav button.on svg{transform:translateY(-3px) scale(1.1)}
nav button::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--orange);position:absolute;bottom:6px;opacity:0;transform:scale(0);transition:.25s}nav button.on::after{opacity:1;transform:scale(1)}
nav button.mid{flex:none;width:68px;height:68px;margin-top:-14px;border-radius:50%;background:var(--card);box-shadow:0 -2px 10px rgba(249,115,22,.35);border:2px solid rgba(249,115,22,.4)}nav button.mid svg{width:32px;height:32px}
#ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;animation:sl .25s ease-out;padding-top:env(safe-area-inset-top,0px)}
.ovh{position:sticky;top:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;z-index:2}.ovh button{background:none;color:#fff;font-size:24px}
.ovb{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 5px rgba(0,0,0,.1)}.prof .av{width:76px;height:76px}
.menu button{display:flex;width:100%;gap:14px;align-items:center;background:var(--card);padding:15px;margin-top:8px;border-radius:12px;font-size:16px;text-align:left}.menu b{margin-left:auto;color:var(--light)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:492px;margin:0 auto;background:var(--blue);color:#fff;padding:12px;border-radius:12px;text-align:center;z-index:60;font-size:14px}
@media print{body>*:not(#ov){display:none!important}.ovh,.noprint{display:none!important}#ov{position:static}}
</style>

<body>
<div id="splash"><div class="logo">RS</div><div id="sn"></div><div class="by">by Rabindra Saxena</div><div class="tg">Padhai Ka Sahi Raasta</div></div>
<div id="auth" class="w hidden"></div>
<div id="main" class="w hidden"><div id="view"></div></div>

<div id="ov" hidden></div><div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps > Web) */
const firebaseConfig={apiKey:"AIzaSyDMB4-D0Q8IVmYbTDjcyQdl3vDVjqkybZI",authDomain:"rsclassesmuskara.firebaseapp.com",projectId:"rsclassesmuskara",storageBucket:"rsclassesmuskara.firebasestorage.app",messagingSenderId:"329772192787",appId:"1:329772192787:web:1db64384daab07fc949be6"};
if(!firebaseConfig.apiKey){document.body.innerHTML='<p style="padding:24px">Paste your Firebase config in index.html (firebaseConfig).</p>';throw new Error('no config')}
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();

const $=id=>document.getElementById(id);
const h=(tag,a={},...k)=>{const e=document.createElement(tag);for(const x in a){if(x==='class')e.className=a[x];else if(x.startsWith('on'))e[x]=a[x];else e.setAttribute(x,a[x])}
  k.flat(Infinity).filter(c=>c!=null&&c!==false).forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=m=>{const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)};
const ERRM={'auth/invalid-phone-number':'Enter a valid phone number','auth/missing-phone-number':'Enter your mobile number','auth/invalid-verification-code':'Wrong OTP. Try again','auth/missing-verification-code':'Enter the 6-digit OTP','auth/code-expired':'OTP expired. Tap Resend OTP','auth/session-expired':'OTP expired. Tap Resend OTP','auth/too-many-requests':'Too many attempts. Try after some time','auth/quota-exceeded':'SMS limit reached. Try later','auth/network-request-failed':'No internet connection','auth/captcha-check-failed':'Verification failed. Refresh and try again','auth/invalid-app-credential':'Verification failed. Refresh and try again','auth/unauthorized-domain':'This website domain is not allowed in Firebase (Authentication > Settings > Authorized domains)','auth/operation-not-allowed':'Google login is not enabled in Firebase (Authentication > Sign-in method > Google)','auth/popup-blocked':'Popup was blocked. Allow popups for this site and try again','auth/account-exists-with-different-credential':'This email is registered with another login method','auth/billing-not-enabled':'Firebase billing (Blaze plan) is needed for real SMS. Use a test number or enable billing','auth/operation-not-supported-in-this-environment':'OTP needs https:// or localhost. Do not open the file directly','auth/web-storage-unsupported':'Browser storage is blocked. Enable cookies/storage','auth/user-disabled':'This account is disabled','unavailable':'No internet connection','permission-denied':'Permission denied. Publish firestore.rules in Firebase'};
const ERR=e=>ERRM[e&&e.code]||('Something went wrong'+(e&&e.code?' ('+e.code+')':'')+'. Please try again.');
const okEnv=()=>/^https?:$/.test(location.protocol);

const S={en:{gm:'Good morning',ga:'Good afternoon',ge:'Good evening',search:'Search courses, teachers...',feat:'Featured courses',pop:'Popular courses',newc:'New courses',cat:'Browse by category',tch:'Our teachers',demo:'Free demo classes',not:'Latest notices',lib:'Library',my:'My Courses',dl:'Downloads',edit:'Edit profile',pur:'Purchase history & invoices',cert:'Certificates',prog:'Attendance & progress',res:'Test results',notif:'Notifications',lang:'Language',help:'Help & support',about:'About',share:'Share app',terms:'Terms & privacy',out:'Logout',enr:'Enroll now',free:'FREE',empty:'No course found.',emy:'You have not enrolled in any course yet. Tap Library to explore.',edl:'Notes of your enrolled courses appear here.',save:'Save'},
hi:{gm:'सुप्रभात',ga:'नमस्कार',ge:'शुभ संध्या',search:'कोर्स, टीचर खोजें...',feat:'खास कोर्स',pop:'लोकप्रिय कोर्स',newc:'नए कोर्स',cat:'कैटेगरी देखें',tch:'हमारे टीचर',demo:'फ्री डेमो क्लास',not:'ताज़ा सूचनाएँ',lib:'लाइब्रेरी',my:'मेरे कोर्स',dl:'डाउनलोड',edit:'प्रोफाइल बदलें',pur:'खरीद इतिहास और इनवॉइस',cert:'सर्टिफिकेट',prog:'उपस्थिति और प्रगति',res:'टेस्ट रिज़ल्ट',notif:'नोटिफिकेशन',lang:'भाषा',help:'मदद और सपोर्ट',about:'ऐप के बारे में',share:'ऐप शेयर करें',terms:'नियम और गोपनीयता',out:'लॉगआउट',enr:'अभी जुड़ें',free:'फ्री',empty:'कोई कोर्स नहीं मिला।',emy:'आपने अभी कोई कोर्स नहीं लिया। लाइब्रेरी में देखें।',edl:'आपके कोर्स के नोट्स यहाँ दिखेंगे।',save:'सेव करें'}};
let lang=ls.get('rs_lang','en');const t=k=>(S[lang]&&S[lang][k])||S.en[k]||k;

const CATS=['Class 9-12','JEE','NEET','SSC','Banking'],CC={'Class 9-12':'#1E3A8A',JEE:'#B45309',NEET:'#15803D',SSC:'#7C3AED',Banking:'#0F766E'};
let D={courses:[],banners:[],teachers:[],demos:[],notices:[]},E={},U=null,tab='home',q='',lcat='All',hcat=CATS[0],pg=null,bt=null,cf=null,vf=null;
const byTag=x=>D.courses.filter(c=>(c.tg||'').includes(x));
const price=c=>c.p>0?'₹'+c.p:t('free');
const grad=c=>'background:linear-gradient(135deg,'+(CC[c.cat]||'#475569')+',#F97316)';
const isAct=c=>E[c.id]&&E[c.id].status==='active';
const pct=c=>isAct(c)&&c.n?Math.round(E[c.id].done*100/c.n):0;

/* ---- splash + silent session check ---- */
'RS Classes Muskara'.split('').forEach((ch,i)=>$('sn').append(h('span',{style:'animation-delay:'+(0.9+i*0.07)+'s'},ch===' '?'\u00a0':ch)));
const authReady=new Promise(r=>{const un=auth.onAuthStateChanged(u=>{un();r(u)})});
Promise.all([new Promise(r=>setTimeout(r,3000)),authReady]).then(([,u])=>{$('splash').hidden=true;route(u)});

async function route(u){
  if(!u)return authView();
  let s;
  try{
    const o=await deviceOwner(u);
    if(o){await auth.signOut().catch(()=>{});as.step='login';as.err='This device is already used by another account ('+mask(o.email)+'). Login with that account, or ask your teacher to reset this device.';return authView()}
    s=await db.collection('users').doc(u.uid).get();
  }catch(e){console.error(e);as.step='retry';as.err=ERR(e);return authView()}
  if(!s.exists){as.step='signup';as.err='';as.name=as.name||u.displayName||'';return authView()}
  U={uid:u.uid,...s.data()};
  await bindDevice(u);
  try{await enter()}catch(e){console.error(e);as.step='retry';as.err=ERR(e);authView()}
}
async function enter(){
  const g=n=>db.collection(n).get().then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
  [D.courses,D.banners,D.teachers,D.demos,D.notices]=await Promise.all(['courses','banners','teachers','demos','notices'].map(g));
  D.notices.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const es=await db.collection('enrollments').where('uid','==',U.uid).get();E={};es.forEach(d=>E[d.data().cid]=d.data());
  $('auth').classList.add('hidden');$('main').classList.remove('hidden');$('nav').classList.remove('hidden');buildNav();tab='home';render();
}

/* ---- login / sign up ---- */
let as={step:'phone',phone:'',err:'',name:'',cls:'Class 10',city:'',photo:''};
const CLS=['Class 9','Class 10','Class 11','Class 12','JEE','NEET','SSC','Banking','Other'];
const errBox=()=>as.err?h('div',{class:'err'},as.err):null;
/* ---- one device = one account ---- */
let DID_OK=true;
const DID=(()=>{let v=null;try{v=localStorage.getItem('rs_did')}catch(e){}
  if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
    try{localStorage.setItem('rs_did',v);if(localStorage.getItem('rs_did')!==v)DID_OK=false}catch(e){DID_OK=false}}
  return v})();
const mask=e=>String(e||'').replace(/^(.{2}).*(@.*)$/,'$1***$2');
async function deviceOwner(u){            // returns the device doc if another account owns this device
  if(!DID_OK)return null;
  const s=await db.collection('devices').doc(DID).get();
  if(!s.exists)return null;const d=s.data();return d.uid===u.uid?null:d;
}
async function bindDevice(u){             // first account to log in on a device claims it
  if(!DID_OK)return;
  try{const r=db.collection('devices').doc(DID);if(!(await r.get()).exists)await r.set({uid:u.uid,email:(u.email||'').toLowerCase(),ts:TS()})}
  catch(e){console.error(e)}
}
async function googleLogin(){
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  return (await auth.signInWithPopup(p)).user;
}
function authView(){
  $('main').classList.add('hidden');$('nav').classList.add('hidden');$('auth').classList.remove('hidden');
  const k=[h('div',{class:'logo'},'RS'),h('h1',{},'RS Classes Muskara'),h('div',{class:'tg'},'Padhai Ka Sahi Raasta')];
  const field=(l,el)=>h('div',{class:'f'},h('label',{},l),el);
  if(as.step==='retry'){
    const b=h('button',{class:'btn'},'Try again');b.onclick=()=>{as.err='';route(auth.currentUser)};
    k.push(h('h2',{},'Could not load'),errBox(),b,h('button',{class:'btn g',onclick:logout},'Logout'));
  }else if(as.step==='signup'){
    const b=h('button',{class:'btn'},'Create account');
    b.onclick=async()=>{
      const u=auth.currentUser;
      if(!u){as.step='login';as.err='Session expired. Login again';return authView()}
      if(as.name.trim().length<2||!as.city.trim()){as.err='Please enter your name and city';return authView()}
      if(as.phone&&!/^[6-9]\d{9}$/.test(as.phone)){as.err='Enter a valid 10-digit mobile number or leave it empty';return authView()}
      b.disabled=true;
      try{const d={name:as.name.trim(),cls:as.cls,city:as.city.trim(),photo:as.photo,phone:as.phone||'',email:(u.email||'').toLowerCase(),createdAt:TS()};
        await db.collection('users').doc(u.uid).set(d);U={uid:u.uid,...d};as.err='';await bindDevice(u);await enter()}catch(e){console.error(e);as.err=ERR(e);authView()}};
    k.push(h('h2',{},'Create your account'),h('p',{class:'sub'},'Signed in as '+((auth.currentUser&&auth.currentUser.email)||'')),
      field('Full name *',h('input',{value:as.name,placeholder:'Your name',oninput:e=>as.name=e.target.value})),
      field('Class / Exam *',h('select',{onchange:e=>as.cls=e.target.value},CLS.map(o=>h('option',{value:o,...(as.cls===o?{selected:''}:{})},o)))),
      field('City *',h('input',{value:as.city,placeholder:'Your city',oninput:e=>as.city=e.target.value})),
      field('Mobile number (optional)',h('input',{type:'tel',inputmode:'numeric',maxlength:'10',value:as.phone,placeholder:'10-digit mobile number',oninput:e=>{as.phone=e.target.value.replace(/\D/g,'');e.target.value=as.phone}})),
      field('Profile photo (optional)',h('input',{type:'file',accept:'image/*',onchange:e=>{const f=e.target.files[0];if(f)resize(f,d=>{as.photo=d;toast('Photo added')})}})),errBox(),b,
      h('button',{class:'btn g',onclick:logout},'Use another account'));
  }else{
    const b=h('button',{class:'btn'},'Continue with Google');
    b.onclick=async()=>{
      if(!okEnv()){as.err=ERR({code:'auth/operation-not-supported-in-this-environment'});return authView()}
      b.disabled=true;b.textContent='Please wait...';as.err='';
      let u;
      try{u=await googleLogin()}
      catch(e){console.error(e);const c=e&&e.code;as.err=(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')?'':ERR(e);return authView()}
      await route(u)};
    k.push(h('h2',{},'Login / Sign up'),h('p',{class:'sub'},'Continue with your Google account'),errBox(),b,
      h('p',{class:'sub',style:'margin-top:14px;font-size:13px'},'One device can be used with one account only.'));
  }

}
